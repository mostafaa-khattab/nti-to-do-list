<html>

<head>
  <title>TO DO ♥</title>
  <link rel="shortcut icon"
    href="https://cdn-icons-png.magnific.com/256/16381/16381802.png?semt=ais_white_label"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="container-fluid px-md-5 py-4 d-flex justify-content-between">
    <h2 class="w-50"><i class="fas fa-clipboard-check"></i> To-Do List</h2>

    <div class="input-group mb-3 w-25 d-flex gap-2">
      <input type="text" id="userContentInput" class="form-control py-2" placeholder="I need..." />
      
      <button class="btn btn-secondary" type="button" onclick="addItem()" id="submitBtn">
        Submit
      </button>
    </div>
  </header>

  <div class="mt-3 mb-4 w-25 mx-auto">
    <input type="search" id="searchInput" class="form-control py-2" placeholder="search..." />
  </div>

  <section id="home" class="container">
    <div id="homeContent" class="home-item mb-2 rounded-pill text-dark mx-auto w-50     bg-danger d-flex justify-content-between align-items-center">
          <p id="itemContent" class="m-0 p-0">Content: English Study</p>
          <i class="fa-sharp fa-solid fa-trash"></i>
    </div>
    
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>

</html>
