<html lang="en">

<head>
  <title>TO DO ♥</title>
  <link rel="shortcut icon"
    href="https://cdn-icons-png.magnific.com/256/16381/16381802.png?semt=ais_white_label"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" 
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="container-fluid px-md-5 py-4 d-flex justify-content-between" role="heading">
    <h2 class="w-50"><i class="fa-solid fa-clipboard-check"></i> To-Do List</h2>
    

    <div class="input-group mb-3 w-25 d-flex gap-2">
      <input type="text" id="userContentInput" class="form-control py-2" placeholder="I need..." />
      
      <button class="btn btn-secondary" type="button" onclick="addItem()"  id="submitBtn">
        Submit
      </button>
    </div>
  </header>

  <div class="mt-3 mb-4 w-25 mx-auto">
    <input type="search" id="searchInput" class="form-control py-2" placeholder="search..." />
  </div>

  <section id="homeContent" class="container">
   
    <!-- display items -->
    
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="main.js"></script>
</body>

</html>
